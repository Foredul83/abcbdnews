<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1e40af" opacity="0.1" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Main Logo Background -->
  <rect x="30" y="30" width="140" height="140" rx="20" fill="#1e40af" opacity="0.15"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- News Paper Icon -->
  <g id="newspaper">
    <!-- Main paper body -->
    <rect x="45" y="50" width="110" height="100" rx="8" fill="url(#logoGradient)" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Paper header (title area) -->
    <rect x="50" y="55" width="100" height="20" rx="4" fill="url(#accentGradient)"/>
    
    <!-- Header text lines -->
    <line x1="55" y1="62" x2="90" y2="62" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="62" x2="130" y2="62" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Content lines (article text) -->
    <line x1="55" y1="82" x2="140" y2="82" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="90" x2="140" y2="90" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="98" x2="135" y2="98" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="106" x2="130" y2="106" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="114" x2="125" y2="114" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="122" x2="140" y2="122" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="130" x2="130" y2="130" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="138" x2="120" y2="138" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Accent decorative circles -->
  <circle cx="160" cy="60" r="15" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <circle cx="165" cy="65" r="8" fill="url(#accentGradient)" opacity="0.7"/>
  
  <!-- Bottom accent line -->
  <line x1="50" y1="155" x2="150" y2="155" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
</svg>