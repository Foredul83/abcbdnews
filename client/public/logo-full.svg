<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g id="icon">
    <rect x="10" y="15" width="70" height="70" rx="10" fill="url(#textGradient)" opacity="0.15"/>
    <rect x="20" y="25" width="50" height="50" rx="8" fill="url(#textGradient)"/>
    
    <!-- News lines -->
    <line x1="28" y1="32" x2="48" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="42" x2="62" y2="42" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="50" x2="62" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="58" x2="55" y2="58" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="66" x2="60" y2="66" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="95" y="65" font-family="'Poppins', Arial, sans-serif" font-size="48" font-weight="800" fill="url(#textGradient)">
    ABCBD News
  </text>
  
  <!-- Tagline -->
  <text x="95" y="85" font-family="'Poppins', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="500">
    Breaking News • Latest Updates
  </text>
</svg>